seed: 42
train:
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  learning_rate: 0.0001
  num_train_epochs: 3
  eval_strategy: steps
  eval_steps: 1000
  save_steps: 1000
  logging_steps: 50
  report_to:
  - wandb
data:
  block_size: 1024
model:
  embedding_dim: 256
  num_blocks: 8
  dropout: 0.1
  slstm_at:
  - 1
  - 3
  - 5
  mlstm_block:
    mlstm:
      conv1d_kernel_size: 4
      qkv_proj_blocksize: 4
      num_heads: 4
  slstm_block:
    slstm:
      backend: cuda
      num_heads: 4
      conv1d_kernel_size: 4
      bias_init: powerlaw_blockdependent
    feedforward:
      proj_factor: 1.3
      act_fn: gelu
  vocab_size: 598
  context_length: 1024
output_dir: experiments/xlstm-base-lr-sweep-tok11/batch_8_constant_1e-4
run_name: batch_8_constant_1e-4

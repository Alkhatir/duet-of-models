seed: 42
train:
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  learning_rate: 0.0003
  lr_schedule:
  - type: linear
    end_step: 200
    start_lr: 3.0e-05
    end_lr: 0.0003
  - type: cosine
    end_step: 8000
    start_lr: 0.0003
    end_lr: 3.0e-05
  - type: constant
    end_step: null
    lr: 3.0e-05
  num_train_epochs: 3
  eval_strategy: steps
  eval_steps: 1000
  save_steps: 1000
  logging_steps: 50
  report_to:
  - wandb
data:
  block_size: 1024
model:
  embedding_dim: 256
  num_blocks: 8
  dropout: 0.1
  slstm_at:
  - 1
  - 3
  - 5
  mlstm_block:
    mlstm:
      conv1d_kernel_size: 4
      qkv_proj_blocksize: 4
      num_heads: 4
  slstm_block:
    slstm:
      backend: cuda
      num_heads: 4
      conv1d_kernel_size: 4
      bias_init: powerlaw_blockdependent
    feedforward:
      proj_factor: 1.3
      act_fn: gelu
  vocab_size: 646
  context_length: 1024
output_dir: experiments/xlstm-base-predefined-tokenizer-batch-sweep-sched-decay-8000/tok_14_batch_8
run_name: tok_14_batch_8

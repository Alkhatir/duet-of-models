seed: 42
train:
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  learning_rate: 0.0001
  lr_schedule:
  - type: linear
    end_step: 200
    start_lr: 1.0e-05
    end_lr: 0.0001
  - type: cosine
    end_step: 24290
    start_lr: 0.0001
    end_lr: 1.0e-05
  - type: cosine
    end_step: 48580
    start_lr: 0.0001
    end_lr: 1.0e-05
  - type: cosine
    end_step: 72870
    start_lr: 0.0001
    end_lr: 1.0e-05
  - type: constant
    end_step: null
    lr: 1.0e-05
  num_train_epochs: 15
  eval_strategy: steps
  eval_steps: 1000
  save_steps: 1000
  logging_steps: 50
  report_to:
  - wandb
data:
  block_size: 1024
model:
  embedding_dim: 384
  num_blocks: 10
  dropout: 0.1
  slstm_at:
  - 1
  - 4
  - 7
  mlstm_block:
    mlstm:
      conv1d_kernel_size: 4
      qkv_proj_blocksize: 4
      num_heads: 8
  slstm_block:
    slstm:
      backend: cuda
      num_heads: 8
      conv1d_kernel_size: 4
      bias_init: powerlaw_blockdependent
    feedforward:
      proj_factor: 1.3
      act_fn: gelu
  vocab_size: 646
  context_length: 1024
output_dir: experiments/xlstm-medium-batch8-tok14-15epoch-cosine-restarts
run_name: xlstm-medium-batch8-tok14-15epoch-cosine-restarts

seed: 42
train:
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 32
  learning_rate: 3e-4
  max_lr: 3e-4
  min_lr: 3e-5
  warmup_steps: 200
  decay_until_step: 2000
  num_train_epochs: 1
  eval_strategy: steps
  eval_steps: 1000
  save_steps: 1000
  logging_steps: 25
  report_to: ["wandb"]
data:
  block_size: 1024

seed: 42
train:
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  learning_rate: 1e-4
  lr_schedule:
    - type: linear
      end_step: 200
      start_lr: 1e-5
      end_lr: 1e-4
    - type: cosine
      end_step: 24290
      start_lr: 1e-4
      end_lr: 1e-5
    - type: cosine
      end_step: 48580
      start_lr: 1e-4
      end_lr: 1e-5
    - type: cosine
      end_step: 72870
      start_lr: 1e-4
      end_lr: 1e-5
    - type: constant
      end_step: null
      lr: 1e-5
  num_train_epochs: 15
  eval_strategy: steps
  eval_steps: 1000
  save_steps: 1000
  logging_steps: 50
  report_to: ["wandb"]
data:
  block_size: 1024

seed: 42
wandb_project: duet-of-models
train:
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  learning_rate: 3e-4
  lr_schedule:
    - type: linear
      end_step: 200
      start_lr: 3e-5
      end_lr: 3e-4
    - type: cosine
      end_step: 8000
      start_lr: 3e-4
      end_lr: 3e-5
    - type: constant
      end_step: null
      lr: 3e-5
  num_train_epochs: 8
  eval_strategy: steps
  eval_steps: 1000
  save_strategy: steps
  save_steps: 1000
  logging_steps: 50
  max_grad_norm: 0.0
  report_to: ["wandb"]
data:
  block_size: 1024

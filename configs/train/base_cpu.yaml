seed: 42
train:
  device: cpu
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  learning_rate: 3e-4
  max_lr: 3e-4
  min_lr: 3e-5
  warmup_steps: 200
  decay_until_step: 1000
  num_train_epochs: 3
  eval_strategy: steps
  eval_steps: 100
  save_steps: 100
  logging_steps: 20
  report_to: ["wandb"]
data:
  block_size: 1024

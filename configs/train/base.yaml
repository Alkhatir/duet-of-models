seed: 42
train:
  per_device_train_batch_size: 2 # batch size needs some playing around. candidates are: 8, 16, 32, 128, 256. The last one I think AI-Guru used in his project
  per_device_eval_batch_size: 2
  learning_rate: 3e-4
  max_lr: 3e-4
  min_lr: 3e-5
  warmup_steps: 1000
  decay_until_step: 10000
  num_train_epochs: 3
  eval_strategy: steps
  eval_steps: 1000
  save_steps: 1000
  logging_steps: 50
  report_to: ["none"]
data:
  block_size: 1024
